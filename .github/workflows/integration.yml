name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  workflow_dispatch:

jobs:
  native:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build_application_native.sh

      - name: Unit Tests
        run: |
          ./scripts/run_unit_tests.sh
          ./scripts/check_coverage.sh

  static-analysis:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Clang Format
        run: ./scripts/run_clang_format.sh --dry-run

  documentation:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Requirements HTML
        run: |
          cd docs/reqs
          make clean && make html

      - name: Build Architecture HTML
        run: |
          cd docs/arch
          make clean && make html

      - name: Upload Architecture artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/arch/_build/html

  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build_application_release.sh

      - name: Clang Tidy
        run: ./scripts/run_clang_tidy.sh
