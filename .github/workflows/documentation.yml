name: Documentation

on:
  push:
    branches: ["master"]

  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Architecture HTML
        run: |
          cd docs/architecture
          make clean && make html

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/architecture/_build/html

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: self-hosted

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
